services:
  - type: web
    name: myshare-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/auth/login
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Yangon
      - key: PORT
        value: "3100"
      - key: DATABASE_URL
        sync: false
      - key: PG_POOL_MAX
        value: "4"
      - key: ADMIN_USERNAME
        value: MyShareAdmin
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: AUTH_TOTP_SECRET
        sync: false
      - key: MYTEL_CLIENT_SECRET
        sync: false
